name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Validate static site
        run: npm run check && npm test
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css ascii-theme.js polytope.js ascii-name.js tesseract.js tesseract-math.js intro.js favicon.svg Eric_Sun_Resume.pdf CNAME _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
